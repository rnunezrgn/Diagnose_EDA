---
# Fix 1A — Create a DE container-registry credential, attach to the DE, restart.
# Requires: ansible.eda collection. Secrets should come from Vault, not inline.
- name: Attach registry credential to Decision Environment and restart activation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    eda_host: "https://aap.example.com"
    eda_token: "REDACTED"            # AAP token (User > Tokens)
    eda_validate_certs: true
    organization: "Default"
    registry_cred_name: "de-registry"
    # Verify the exact type string via GET /api/eda/v1/credential-types/
    registry_cred_type: "Decision Environment Container Registry"
    registry_host: "registry.redhat.io"
    registry_username: "1234567|svc-account"
    registry_token: "REDACTED"
    de_name: "de-golden-path-rhel9"
    de_image: "registry.redhat.io/ansible-automation-platform-25/de-supported-rhel9:latest"
    activation_name: "my-activation"
  module_defaults:
    ansible.eda.credential: &eda_conn
      controller_host: "{{ eda_host }}"
      controller_token: "{{ eda_token }}"
      validate_certs: "{{ eda_validate_certs }}"
    ansible.eda.decision_environment: *eda_conn
    ansible.eda.rulebook_activation: *eda_conn
  tasks:
    - name: Create / update the container-registry credential
      ansible.eda.credential:
        name: "{{ registry_cred_name }}"
        credential_type_name: "{{ registry_cred_type }}"
        organization_name: "{{ organization }}"
        inputs:
          host: "{{ registry_host }}"
          username: "{{ registry_username }}"
          password: "{{ registry_token }}"
        state: present

    - name: Attach the credential to the Decision Environment
      ansible.eda.decision_environment:
        name: "{{ de_name }}"
        image_url: "{{ de_image }}"
        credential_name: "{{ registry_cred_name }}"
        organization_name: "{{ organization }}"
        state: present

    # Restart = disable then enable so EDA regenerates activation-secret-<id>.
    # Some ansible.eda versions accept `state: restarted` instead, and/or require
    # project_name/rulebook_name/decision_environment_name on update — add them
    # if the toggle errors.
    - name: Disable the activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        organization_name: "{{ organization }}"
        enabled: false
        state: present

    - name: Pause briefly
      ansible.builtin.pause:
        seconds: 5

    - name: Re-enable the activation (regenerates the pull secret)
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        organization_name: "{{ organization }}"
        enabled: true
        state: present