---
# Step 1 — Is the activation pod running? Flags FailedToRetrieveImagePullSecret,
# and (Step 1B) surfaces crash-looping pods, their image (spot a stale DE base),
# and the previous container's logs.
# Requires: kubernetes.core >= 2.4.0 (for `previous` logs); KUBECONFIG set.
- name: Check EDA activation pod, pull secret, and crash state
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ocp_namespace: "eda"            # <-- your activation namespace
    pod_name_filter: "activation"   # substring that matches activation pods
    stale_regex: "platform-24"      # image pattern to flag (AAP 2.4 base)
  tasks:
    - name: Get pods in the namespace
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ ocp_namespace }}"
      register: pods

    - name: Select activation pods
      ansible.builtin.set_fact:
        activation_pods: "{{ pods.resources | selectattr('metadata.name', 'search', pod_name_filter) | list }}"

    - name: Summarize phase + image + restarts + waiting reason + pull secrets
      ansible.builtin.debug:
        msg:
          - "pod: {{ item.metadata.name }}"
          - "phase: {{ item.status.phase | default('unknown') }}"
          - "image: {{ item.spec.containers | map(attribute='image') | list }}"
          - "restarts: {{ item.status.containerStatuses | default([]) | map(attribute='restartCount') | sum }}"
          - "waiting: {{ item.status.containerStatuses | default([]) | map(attribute='state.waiting.reason') | select('defined') | list }}"
          - "imagePullSecrets: {{ item.spec.imagePullSecrets | default([]) | map(attribute='name') | list }}"
      loop: "{{ activation_pods }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Check whether each referenced pull secret exists
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ ocp_namespace }}"
        name: "{{ secret_name }}"
      loop: "{{ activation_pods | map(attribute='spec.imagePullSecrets') | map('default', []) | list | flatten | map(attribute='name') | unique | list }}"
      loop_control:
        loop_var: secret_name
      register: secret_check

    - name: Report MISSING pull secrets (a successful pull makes this a red herring)
      ansible.builtin.debug:
        msg: "MISSING pull secret: {{ item.secret_name }}"
      loop: "{{ secret_check.results }}"
      loop_control:
        label: "{{ item.secret_name }}"
      when: item.resources | length == 0

    # ---- Step 1B: crash-loop detection + stale-DE hint ----------------------
    - name: Fetch previous-container logs for pods that have restarted
      kubernetes.core.k8s_log:
        namespace: "{{ ocp_namespace }}"
        name: "{{ item.metadata.name }}"
        previous: true               # requires kubernetes.core >= 2.4.0
      loop: "{{ activation_pods }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: prev_logs
      failed_when: false
      when: (item.status.containerStatuses | default([]) | map(attribute='restartCount') | sum) > 0

    - name: Show last lines of the crashed run (the real failure)
      ansible.builtin.debug:
        msg: "{{ (item.log | default('')).split('\n')[-30:] }}"
      loop: "{{ prev_logs.results | default([]) }}"
      loop_control:
        label: "{{ item.item.metadata.name | default('') }}"
      when: item.log is defined and (item.log | length) > 0

    - name: Hint — activation pod running an AAP 2.4-era image (rebuild on 2.5/2.6)
      ansible.builtin.debug:
        msg: "STALE DE IMAGE on {{ item.metadata.name }}: {{ item.spec.containers | map(attribute='image') | list }}"
      loop: "{{ activation_pods }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: item.spec.containers | map(attribute='image') | join(' ') is search(stale_regex)

    - name: Get recent events
      kubernetes.core.k8s_info:
        kind: Event
        namespace: "{{ ocp_namespace }}"
      register: events

    - name: Show pull-related events
      ansible.builtin.debug:
        msg: "{{ item.reason }}: {{ item.message }}"
      loop: "{{ events.resources | selectattr('message', 'search', '(?i)pull') | list }}"
      loop_control:
        label: "{{ item.reason | default('') }}"
