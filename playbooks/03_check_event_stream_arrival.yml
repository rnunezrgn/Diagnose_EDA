---
# Step 2/3 — Did events arrive, and what did the test-mode capture record?
# Read-only. Run with "Forward events to rulebook activation" OFF on the stream.
- name: Inspect Event Stream arrival stats and test capture
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    eda_host: "https://aap.example.com"
    eda_token: "REDACTED"
    eda_validate_certs: true
    event_stream_name: "snow-incidents"
  tasks:
    - name: Look up the event stream
      ansible.builtin.uri:
        url: "{{ eda_host }}/api/eda/v1/event-streams/?name={{ event_stream_name | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ eda_token }}"
        validate_certs: "{{ eda_validate_certs }}"
        return_content: true
      register: es

    - name: Report arrival stats + test capture
      ansible.builtin.debug:
        msg:
          - "events_received: {{ stream.events_received | default('n/a') }}"
          - "last_event_received_at: {{ stream.last_event_received_at | default('never') }}"
          - "test_headers: {{ stream.test_headers | default('') }}"
          - "test_content: {{ stream.test_content | default('') }}"
          - "test_error_message: {{ stream.test_error_message | default('') }}"
      vars:
        stream: "{{ (es.json.results | default([]) | first) | default({}) }}"
      when: (es.json.results | default([])) | length > 0